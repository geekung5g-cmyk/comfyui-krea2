<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · Model Dashboard</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#2a3140;--fg:#e6edf3;--muted:#8b949e;--accent:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
    font-family:"Noto Sans Thai","Segoe UI",system-ui,sans-serif;padding:20px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;
    width:100%;max-width:420px}
  h1{margin:0 0 6px;font-size:18px}
  p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 18px}
  input{width:100%;background:#0b0f16;border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:11px 13px;font-family:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:14px;background:var(--accent);color:#08121f;border:0;
    border-radius:8px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
  .err{color:#ffb4ae;font-size:13px;margin-top:12px;min-height:18px}
  code{background:#0b0f16;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
  <div class="box">
    <h1>Model Dashboard</h1>
    <p>ใส่ <b>DASHBOARD_TOKEN</b> เพื่อเข้าใช้งาน<br>
       หาโทเคนได้จาก Instance Logs บน Vast.ai หรือรัน <code>cat /workspace/.credentials</code></p>
    <input id="t" type="password" placeholder="DASHBOARD_TOKEN" autofocus autocomplete="off">
    <button id="b">เข้าสู่ระบบ</button>
    <div class="err" id="e"></div>
  </div>
<script>
  const go = async () => {
    const t = document.getElementById('t').value.trim();
    document.getElementById('e').textContent = '';
    try {
      const r = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin', body: JSON.stringify({token: t})
      });
      if (!r.ok) throw new Error('โทเคนไม่ถูกต้อง');
      location.href = '/';
    } catch (err) { document.getElementById('e').textContent = err.message; }
  };
  document.getElementById('b').onclick = go;
  document.getElementById('t').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
