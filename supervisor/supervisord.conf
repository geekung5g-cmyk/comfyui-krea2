[supervisord]
nodaemon=true
user=root
logfile=/var/log/services/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:comfyui]
command=/opt/scripts/start-comfyui.sh
directory=/opt/ComfyUI
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/services/comfyui.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
priority=20

[program:dashboard]
command=/opt/scripts/start-dashboard.sh
directory=/opt/dashboard
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/services/dashboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
priority=10

[program:jupyter]
command=/opt/scripts/start-jupyter.sh
directory=/workspace
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/services/jupyter.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
priority=30

[program:sshd]
command=/opt/scripts/start-sshd.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/services/sshd.log
redirect_stderr=true
priority=40
